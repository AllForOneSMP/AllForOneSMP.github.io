<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - Page Not Found | AllForOne SMP</title>
        <meta name="robots" content="noindex" />

        <link rel="icon" type="image/png" href="https://allforonesmp.github.io/images/logo.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Spectral:wght@600;700&family=Bebas+Neue&display=swap"
            rel="stylesheet" />

        <script>
            (function () {
                var STORAGE_KEY = "afo_theme";
                function getStored() {
                    try {
                        return localStorage.getItem(STORAGE_KEY);
                    } catch (_) {
                        return null;
                    }
                }
                function apply(theme) {
                    document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
                }
                apply(getStored() || "light");
                document.addEventListener("DOMContentLoaded", function () {
                    apply(getStored() || "light");
                });
            })();
        </script>

        <style>
            :root {
                --primary-blue: #4a90e2;
                --light-blue: #e8f4f8;
                --lighter-blue: #f5fbfd;
                --dark-blue: #2c5f8d;
                --accent-blue: #5ba3f5;
                --text-dark: #1a2332;
                --text-medium: #4a5568;
                --text-light: #718096;
                --border-color: #d4e8f0;
                --white: #ffffff;
                --shadow-md: 0 4px 12px rgba(74, 144, 226, 0.12);
                --shadow-lg: 0 10px 30px rgba(74, 144, 226, 0.15);
            }

            :root[data-theme="dark"] {
                --primary-blue: #5ba3f5;
                --light-blue: #1e2a38;
                --lighter-blue: #141c26;
                --dark-blue: #7db8f8;
                --accent-blue: #5ba3f5;
                --text-dark: #eef2f7;
                --text-medium: #b7c2cf;
                --text-light: #8a97a6;
                --border-color: #2c3b4a;
                --white: #1a232e;
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                font-family: "DM Sans", sans-serif;
                background: linear-gradient(135deg, var(--lighter-blue) 0%, var(--light-blue) 100%);
                color: var(--text-dark);
                min-height: 100vh;
                line-height: 1.6;
                transition:
                    background-color 0.25s ease,
                    color 0.25s ease;
                display: flex;
                flex-direction: column;
            }

            h1,
            h2,
            h3 {
                font-family: "Spectral", serif;
                font-weight: 700;
            }

            .error-wrap {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }

            .error-card {
                background: var(--white);
                border: 1px solid var(--border-color);
                border-radius: 20px;
                box-shadow: var(--shadow-lg);
                max-width: 560px;
                width: 100%;
                padding: 3rem 2.5rem;
                text-align: center;
            }

            .error-card img {
                width: 90px;
                height: 90px;
                margin-bottom: 1.25rem;
                opacity: 0.9;
            }

            .error-code {
                font-family: "Bebas Neue", sans-serif;
                font-size: 6rem;
                letter-spacing: 0.08em;
                color: var(--primary-blue);
                line-height: 1;
                margin-bottom: 0.5rem;
            }

            .error-title {
                font-size: 1.5rem;
                color: var(--text-dark);
                margin-bottom: 0.75rem;
            }

            .error-message {
                color: var(--text-medium);
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .error-actions {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                border-radius: 12px;
                padding: 0.85rem 1.5rem;
                font-weight: 700;
                font-family: "DM Sans", sans-serif;
                font-size: 0.98rem;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.2s ease;
                border: none;
            }

            .btn-primary {
                background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
                color: white;
                box-shadow: 0 4px 15px rgba(74, 144, 226, 0.35);
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(74, 144, 226, 0.45);
            }

            .btn-secondary {
                background: var(--lighter-blue);
                border: 2px solid var(--border-color);
                color: var(--primary-blue);
            }
            .btn-secondary:hover {
                background: var(--light-blue);
                border-color: var(--primary-blue);
                transform: translateY(-2px);
            }

            footer {
                background: var(--text-dark);
                color: #a0aec0;
                text-align: center;
                padding: 2rem;
                font-size: 0.9rem;
            }
            :root[data-theme="dark"] footer {
                background: #0d1319;
            }
            footer a {
                color: var(--accent-blue);
                text-decoration: none;
            }

            @media (max-width: 480px) {
                .error-card {
                    padding: 2.25rem 1.5rem;
                }
                .error-code {
                    font-size: 4.5rem;
                }
                .error-title {
                    font-size: 1.2rem;
                }
                .error-actions {
                    flex-direction: column;
                }
                .btn {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="error-wrap">
            <div class="error-card">
                <img src="https://allforonesmp.github.io/images/logo.png" alt="AllForOne SMP" />
                <div class="error-code">404</div>
                <h1 class="error-title" id="errorTitle">Lost in the Wilderness</h1>
                <p class="error-message" id="errorMessage">
                    Looks like this block hasn't been placed yet. The page you're looking for doesn't exist or may
                    have moved.
                </p>
                <div class="error-actions">
                    <a href="https://allforonesmp.github.io/" class="btn btn-primary">Back to Home</a>
                    <a href="https://allforonesmp.github.io/rules" class="btn btn-secondary">Server Rules</a>
                </div>
            </div>
        </div>

        <footer>
            <p>
                AllForOne SMP &copy; 2026 &nbsp;|&nbsp;
                <a href="https://allforonesmp.github.io/rules">Rules</a> &nbsp;
            </p>
        </footer>
     <script>
            // Add as many entries here as you like — the queue cycles through all of them
            // in random order, then reshuffles and repeats.
            var NOT_FOUND_MESSAGES = [
                {
                    title: "What u tryin' to find player?",
                    message: "idk what link you typed in that adress bar but that's not it!"
                },
                {
                    title: "lol",
                    message: "That's not a link bro"
                },
                {
                    title: "Uhm, Excuse me sir..",
                    message: "I didn't know that you couldn't type"
                },
                {
                    title: "...",
                    message: "-_-"
                },
                {
                    title: "don't even try to visit this link again",
                    message: "Don't visit this one or https://allforonesmp.github.io/free-robux"
                },
                {
                    title: "AHHHHH",
                    message: "WHAT IS THAT UNKOWN TEXT!?!?!"
                }
            ];

            (function () {
                var STORAGE_KEY = "afo_404_queue";
                var count = NOT_FOUND_MESSAGES.length;

                function shuffledIndices() {
                    var arr = [];
                    for (var i = 0; i < count; i++) arr.push(i);
                    for (var j = arr.length - 1; j > 0; j--) {
                        var k = Math.floor(Math.random() * (j + 1));
                        var tmp = arr[j];
                        arr[j] = arr[k];
                        arr[k] = tmp;
                    }
                    return arr;
                }

                var queue = [];
                try {
                    var stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) queue = JSON.parse(stored).filter((i) => i >= 0 && i < count);
                } catch (_) {}

                if (!Array.isArray(queue) || queue.length === 0) {
                    queue = shuffledIndices();
                }

                var index = queue.shift();

                if (queue.length === 0 && count > 1) {
                    queue = shuffledIndices();
                    if (queue[0] === index) {
                        queue.push(queue.shift());
                    }
                }

                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
                } catch (_) {}

                var pick = NOT_FOUND_MESSAGES[index];
                document.getElementById("errorTitle").textContent = pick.title;
                document.getElementById("errorMessage").textContent = pick.message;
            })();
        </script>
    </body>
</html>
